[package]
name        = "ree0xq-net"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "ree0xQ network module — TLS / SSH / IPsec ciphersuite observation via eBPF"

[lib]
name = "ree0xq_net"
path = "src/lib.rs"

[dependencies]
ree0xq-core         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
chrono             = { workspace = true }
clap               = { version = "4", features = ["derive"] }
hex                = "0.4"
reqwest            = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# PQ-capable probe (Phase 1.5). rustls 0.23 + rustls-post-quantum
# registers the X25519MLKEM768 hybrid group on a custom CryptoProvider.
rustls             = "0.23"
rustls-post-quantum = "0.2"
tokio-rustls       = "0.26"
rustls-pki-types   = "1"
webpki-roots       = "0.26"
x509-parser        = "0.16"
# Phase 2.0 live mode — passive pcap-file observation. Pure-Rust so
# the crate builds on machines without libpcap-devel; the libpcap
# live-interface path is gated behind `live-pcap` (Phase 2.2) and
# the eBPF path behind `live-interface` (Phase 2.1).
pcap-file          = "2"
etherparse         = "0.16"

[dev-dependencies]
tempfile = "3"
# End-to-end smoke: spin ree0xq-server in-process and check that
# the events ree0xq-net emits round-trip through the collector.
# The ree0xq-server AppState constructor wants a CA directory,
# hence tempfile.
ree0xq-server = { workspace = true }
axum         = { workspace = true }

[features]
# Default build is offline-pcap only (no system deps beyond libc).
default = []
# Phase 2.2 — libpcap-backed live interface capture. Brings in the
# `pcap` crate, which links against the system libpcap. Build needs
# `libpcap-devel` (Fedora) / `libpcap-dev` (Debian); run needs
# `CAP_NET_RAW`. Friendly for `lo` smoke tests.
live-pcap = ["dep:pcap", "dep:ctrlc"]
# Phase 2.1 — live interface capture via aya + the kernel-side
# `ree0xq-net-ebpf` crate. Requires `aya` 0.13 + a pre-built BPF
# object at `target/bpfel-unknown-none/release/ree0xq-net-ebpf`.
# See crates/ree0xq-net-ebpf/README.md for the build dance.
live-interface = ["dep:aya", "dep:aya-log"]

[dependencies.pcap]
version = "2"
optional = true

[dependencies.ctrlc]
version = "3"
optional = true

[dependencies.aya]
version = "0.13"
optional = true

[dependencies.aya-log]
version = "0.2"
optional = true

# Phase-1 binary: pipe zgrab2 JSON output into crypto_inventory_event records.
# Phase 2 (eBPF live observation) lands in #SEZ-3 and adds aya deps.
[[bin]]
name = "ree0xq-net"
path = "src/bin/ree0xq_net.rs"

[package.metadata.deb]
maintainer = "e2e Solutions <info@e2esolutions.tech>"
copyright = "2025-2026 e2e Solutions"
license-file = ["../../LICENSE", "0"]
extended-description = "Passive TLS handshake observer. Pcap-file replay, libpcap live capture, and aya/eBPF live mode emit one crypto_inventory_event per observed session into a ree0xQ collector. Now includes a userspace recent-session dedup cache (SEZ-25)."
section = "net"
priority = "optional"
depends = "$auto"
assets = [
  ["target/release/ree0xq-net", "usr/local/bin/", "755"],
  ["../../dist/systemd/ree0xq-net-live.service", "lib/systemd/system/", "644"],
  ["../../docs/module-net.md", "usr/share/doc/ree0xq-net/", "644"],
]
systemd-units = { unit-name = "ree0xq-net-live", enable = false, start = false }

[package.metadata.generate-rpm]
name = "ree0xq-net"
version = "0.1.0"
license = "MIT"
summary = "ree0xQ passive TLS handshake observer"
assets = [
  { source = "target/release/ree0xq-net", dest = "/usr/local/bin/ree0xq-net", mode = "755" },
  { source = "dist/systemd/ree0xq-net-live.service", dest = "/usr/lib/systemd/system/ree0xq-net-live.service", mode = "644" },
  { source = "docs/module-net.md", dest = "/usr/share/doc/ree0xq-net/module-net.md", mode = "644" },
]
post_install_script = "install -d -m 0750 -o ree0xq -g ree0xq /var/lib/ree0xq-net /var/lib/ree0xq-net/spool 2>/dev/null || true; systemctl daemon-reload || true"
pre_uninstall_script = "systemctl disable --now ree0xq-net-live 2>/dev/null || true"
