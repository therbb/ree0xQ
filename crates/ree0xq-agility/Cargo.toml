[package]
name        = "ree0xq-agility"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "ree0xQ crypto-agility scanner + V5 PQ-migration recommendations engine"

[dependencies]
ree0xq-core   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
serde_yaml   = "0.9"
anyhow       = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
chrono       = { workspace = true }
walkdir      = "2"
regex        = "1"
clap         = { version = "4", features = ["derive"] }
# V5 recommendation CLI fetches /v1/inventory.
reqwest      = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile     = "3"
ree0xq-server = { workspace = true }
axum         = { workspace = true }
tokio        = { workspace = true }

[[bin]]
name = "ree0xq-agility"
path = "src/bin/agility.rs"

[package.metadata.deb]
maintainer = "e2e Solutions <info@e2esolutions.tech>"
copyright = "2025-2026 e2e Solutions"
license-file = ["../../LICENSE", "0"]
extended-description = "Crypto-agility scanner + V5 PQ-migration recommendations engine. Reads the live inventory from a ree0xQ collector and produces ranked per-asset replacement candidates, a TLS-stack compatibility matrix, and the regulator deadline table."
section = "net"
priority = "optional"
depends = "$auto"
assets = [
  ["target/release/ree0xq-agility", "usr/local/bin/", "755"],
]

[package.metadata.generate-rpm]
name = "ree0xq-agility"
version = "0.1.0"
license = "MIT"
summary = "ree0xQ crypto-agility scanner + V5 recommendations CLI"
assets = [
  { source = "target/release/ree0xq-agility", dest = "/usr/local/bin/ree0xq-agility", mode = "755" },
]
