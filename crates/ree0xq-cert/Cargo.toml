[package]
name        = "ree0xq-cert"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "ree0xQ certificate inventory module (V2 — host-scan, CT-scan, vault-scan)"

[lib]
name = "ree0xq_cert"
path = "src/lib.rs"

[[bin]]
name = "ree0xq-cert"
path = "src/bin/ree0xq_cert.rs"

[dependencies]
ree0xq-core         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
chrono             = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { version = "4", features = ["derive"] }
# Cert parsing + walking. x509-parser brings its own pem
# submodule (Pem::read iterator) so we don't need a separate
# `pem` crate alongside it.
x509-parser        = "0.16"
walkdir            = "2"
hex                = "0.4"
sha2               = "0.10"
# Collector POST. Blocking client keeps the binary's main path
# synchronous; matches ree0xq-net's Sink pattern.
reqwest            = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
# rcgen mints self-signed certs the parser tests load. Same
# crate ree0xq-server uses for its CA path.
rcgen    = { version = "0.13", default-features = false, features = ["pem", "ring"] }
# End-to-end smoke: spin ree0xq-server's router in-process and
# round-trip events through it.
ree0xq-server = { workspace = true }
axum         = { workspace = true }
tokio        = { workspace = true }

[package.metadata.deb]
maintainer = "e2e Solutions <info@e2esolutions.tech>"
copyright = "2025-2026 e2e Solutions"
license-file = ["../../LICENSE", "0"]
extended-description = "Certificate inventory agent — host filesystem scanner, Certificate Transparency log puller, and HashiCorp Vault PKI scanner. Emits one crypto_inventory_event per discovered X.509 certificate."
section = "net"
priority = "optional"
depends = "$auto"
assets = [
  ["target/release/ree0xq-cert", "usr/local/bin/", "755"],
  ["../../dist/systemd/ree0xq-cert-host-scan.service", "lib/systemd/system/", "644"],
  ["../../dist/systemd/ree0xq-cert-host-scan.timer", "lib/systemd/system/", "644"],
]
systemd-units = { unit-name = "ree0xq-cert-host-scan", enable = false, start = false }

[package.metadata.generate-rpm]
name = "ree0xq-cert"
version = "0.1.0"
license = "MIT"
summary = "ree0xQ certificate inventory agent"
assets = [
  { source = "target/release/ree0xq-cert", dest = "/usr/local/bin/ree0xq-cert", mode = "755" },
  { source = "dist/systemd/ree0xq-cert-host-scan.service", dest = "/usr/lib/systemd/system/ree0xq-cert-host-scan.service", mode = "644" },
  { source = "dist/systemd/ree0xq-cert-host-scan.timer", dest = "/usr/lib/systemd/system/ree0xq-cert-host-scan.timer", mode = "644" },
]
post_install_script = "systemctl daemon-reload || true"
pre_uninstall_script = "systemctl disable --now ree0xq-cert-host-scan.timer 2>/dev/null || true"
