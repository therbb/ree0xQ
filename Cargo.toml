[workspace]
resolver = "2"
members = [
    "crates/ree0xq-core",
    "crates/ree0xq-server",
    "crates/ree0xq-net",
    "crates/ree0xq-cert",
    "crates/ree0xq-chain",
    "crates/ree0xq-id",
    "crates/ree0xq-qkd",
    "crates/ree0xq-agility",
]

[workspace.package]
version       = "0.1.0-dev"
edition       = "2021"
rust-version  = "1.88"
authors       = ["e2e Solutions <info@e2esolutions.tech>"]
license       = "MIT"
repository    = "https://github.com/e2esolutions-tech/ree0xQ"
homepage      = "https://github.com/e2esolutions-tech/ree0xQ"

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
anyhow      = "1"
thiserror   = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1", features = ["serde", "v4"] }
axum        = "0.7"
tower       = "0.5"

# Workspace-internal
ree0xq-core    = { path = "crates/ree0xq-core" }
ree0xq-server  = { path = "crates/ree0xq-server" }
ree0xq-agility = { path = "crates/ree0xq-agility" }
